# Pages CMS — content editing for the portfolio (https://app.pagescms.org).
# Texts live in src/content/*.json; design, layout and images stay in code.
components:
  bi:
    type: "object"
    fields:
      - name: "he"
        label: "עברית"
        type: "string"
      - name: "en"
        label: "English"
        type: "string"
  bitext:
    type: "object"
    fields:
      - name: "he"
        label: "עברית"
        type: "text"
      - name: "en"
        label: "English"
        type: "text"
content:
  - name: "projects"
    label: "פרויקטים"
    type: "file"
    path: "src/content/projects.json"
    format: "json"
    list: true
    description: "הסדר באתר נקבע לפי קטגוריה ושנה (החדש קודם); הסדר כאן קובע רק בין פרויקטים מאותה שנה. הוספת פרויקט חדש עם תמונות עוד לא נתמכת מכאן."
    fields:
      - name: "slug"
        label: "כתובת הפרויקט באתר"
        type: "string"
        readonly: true
        description: "קובע את הכתובת של העמוד — לא לשנות"
      - name: "title"
        label: "שם הפרויקט"
        component: "bi"
      - name: "subtitle"
        label: "תת-כותרת"
        component: "bitext"
      - name: "client"
        label: "לקוח"
        component: "bi"
      - name: "year"
        label: "שנה"
        type: "string"
        description: "קובע את הסדר בתוך הקטגוריה — החדש קודם"
      - name: "category"
        label: "קטגוריה"
        type: "select"
        required: true
        options:
          values:
            - value: "party-branding"
              label: "מיתוג מסיבות"
            - value: "posters-covers"
              label: "פוסטרים ועטיפות"
            - value: "brand-identity"
              label: "זהות מותג ומוצר"
        description: "מיתוג מסיבות = סדרת חומרים לאירוע; פוסטרים ועטיפות = יצירה אחת לאמן או ללייבל"
      - name: "discipline"
        label: "תחומים"
        component: "bi"
        list: true
      - name: "tools"
        label: "כלים"
        type: "string"
        list: true
      - name: "accent"
        label: "צבע מבטא (HEX)"
        type: "string"
        pattern:
          regex: "^#[0-9A-Fa-f]{6}$"
          message: "צבע בפורמט #RRGGBB"
      - name: "cover"
        label: "תמונה בדף הבית"
        type: "object"
        fields:
          - name: "id"
            label: "קובץ התמונה"
            type: "string"
            readonly: true
            description: "מזהה של תמונה שכבר עובדה לאתר — אי אפשר לשנות כאן"
          - name: "alt"
            label: "תיאור התמונה (לנגישות ולגוגל)"
            component: "bitext"
          - name: "focus"
            label: "איזה חלק לשמור כשהתמונה נחתכת"
            type: "string"
            description: "למשל 50% 0% = שומר את החלק העליון. ריק = מרכז."
      - name: "hero"
        label: "תמונה בראש עמוד הפרויקט"
        type: "object"
        fields:
          - name: "id"
            label: "קובץ התמונה"
            type: "string"
            readonly: true
            description: "מזהה של תמונה שכבר עובדה לאתר — אי אפשר לשנות כאן"
          - name: "alt"
            label: "תיאור התמונה (לנגישות ולגוגל)"
            component: "bitext"
      - name: "intro"
        label: "פסקאות פתיחה"
        component: "bitext"
        list: true
      - name: "details"
        label: "פרטים (קונספט, טיפוגרפיה, צבע)"
        type: "object"
        list:
          collapsible: true
        fields:
          - name: "label"
            label: "כותרת"
            component: "bi"
          - name: "body"
            label: "טקסט"
            component: "bitext"
          - name: "colors"
            label: "דוגמיות צבע (HEX)"
            type: "string"
            list: true
      - name: "gallery"
        label: "גלריה"
        type: "object"
        fields:
          - name: "id"
            label: "קובץ התמונה"
            type: "string"
            readonly: true
            description: "מזהה של תמונה שכבר עובדה לאתר — אי אפשר לשנות כאן"
          - name: "alt"
            label: "תיאור התמונה (לנגישות ולגוגל)"
            component: "bitext"
        list:
          collapsible: true
        description: "אפשר לשנות סדר ותיאורים; תמונות חדשות עוד לא נתמכות מכאן"
      - name: "behance"
        label: "קישור ל-Behance"
        type: "string"
  - name: "categories"
    label: "קטגוריות"
    type: "file"
    path: "src/content/categories.json"
    format: "json"
    list: true
    description: "שם ומשפט לכל קטגוריה. הסדר כאן הוא הסדר באתר. הוספה או מחיקה של קטגוריה — בקוד."
    fields:
      - name: "slug"
        label: "כתובת הקטגוריה באתר"
        type: "string"
        readonly: true
        description: "קובע את הכתובת /work/... — לא לשנות"
      - name: "title"
        label: "שם הקטגוריה"
        component: "bi"
      - name: "intro"
        label: "משפט הסבר"
        component: "bitext"
      - name: "lead"
        label: "פרויקט מייצג בדף הבית"
        type: "select"
        required: true
        options:
          values:
            - value: "changa-crew-russian-edition"
              label: "Changa Crew — Russian Edition"
            - value: "changa-crew-one-year"
              label: "Changa Crew — One Year"
            - value: "shikingim-aviv-edition"
              label: "Shikingim — Aviv Edition"
            - value: "shikingim-winter-edition"
              label: "Shikingim — Winter Edition"
            - value: "codex-saltus"
              label: "Codex Saltus"
            - value: "orebro-forest-party"
              label: "Örebro Forest Party"
            - value: "dj-sharon"
              label: "DJ Sharon"
            - value: "trance-tribe"
              label: "Trance Tribe"
            - value: "cosmix"
              label: "Cosmix"
            - value: "mey-israel"
              label: "מי ישראל"
            - value: "kulanoo"
              label: "כולנו"
            - value: "shuk-petah-tikva"
              label: "שוק פתח תקווה"
        description: "התמונה שלו מייצגת את הקטגוריה בגלגלת שבדף הבית. חייב להיות פרויקט מאותה קטגוריה."
  - name: "about"
    label: "עמוד אודות"
    type: "file"
    path: "src/content/about.json"
    format: "json"
    fields:
      - name: "label"
        label: "תווית"
        component: "bi"
      - name: "title"
        label: "כותרת ראשית"
        component: "bitext"
      - name: "p1"
        label: "פסקה 1 (מודגשת)"
        component: "bitext"
      - name: "p2"
        label: "פסקה 2"
        component: "bitext"
      - name: "p3"
        label: "פסקה 3"
        component: "bitext"
      - name: "p4"
        label: "פסקה 4"
        component: "bitext"
      - name: "imgAlt"
        label: "תיאור התמונה (לנגישות)"
        component: "bitext"
      - name: "whatLabel"
        label: "כותרת מה אני עושה"
        component: "bi"
      - name: "bgLabel"
        label: "כותרת רקע"
        component: "bi"
      - name: "toolsLabel"
        label: "כותרת כלים"
        component: "bi"
      - name: "services"
        label: "מה אני עושה — שירותים"
        type: "object"
        list:
          collapsible: true
        fields:
          - name: "title"
            label: "שירות"
            component: "bi"
          - name: "body"
            label: "תיאור"
            component: "bitext"
      - name: "background"
        label: "רקע — השכלה וניסיון"
        type: "object"
        list:
          collapsible: true
        fields:
          - name: "when"
            label: "מתי"
            component: "bi"
          - name: "title"
            label: "תפקיד או מוסד"
            component: "bi"
          - name: "body"
            label: "תיאור"
            component: "bitext"
          - name: "link"
            label: "קישור (לא חובה)"
            type: "string"
            description: "נתיב באתר, למשל /work/trance-tribe/"
      - name: "tools"
        label: "כלים"
        type: "object"
        list: true
        fields:
          - name: "label"
            label: "קבוצה"
            component: "bi"
          - name: "value"
            label: "הכלים"
            type: "string"
  - name: "ui"
    label: "טקסטים כלליים — מסך פתיחה, תפריט, טופס"
    type: "file"
    path: "src/content/ui.json"
    format: "json"
    fields:
      - name: "role"
        label: "תפקיד"
        component: "bi"
      - name: "location"
        label: "מיקום"
        component: "bi"
      - name: "available"
        label: "סטטוס זמינות (בכותרת העליונה)"
        component: "bi"
      - name: "name"
        label: "שם מלא"
        component: "bi"
      - name: "nameLines"
        label: "השם בכותרת הראשית — שורה לכל חלק"
        type: "object"
        fields:
          - name: "he"
            label: "עברית"
            type: "string"
            list: true
          - name: "en"
            label: "English"
            type: "string"
            list: true
      - name: "description"
        label: "תיאור האתר (לגוגל ולשיתוף ברשתות)"
        component: "bitext"
      - name: "nav"
        label: "תפריט"
        type: "object"
        fields:
          - name: "work"
            label: "עבודות"
            component: "bi"
          - name: "about"
            label: "אודות"
            component: "bi"
          - name: "contact"
            label: "צור קשר"
            component: "bi"
      - name: "switchTo"
        label: "קישור החלפת שפה"
        component: "bi"
      - name: "switchLabel"
        label: "תיאור קישור החלפת השפה (לקוראי מסך)"
        component: "bi"
      - name: "skip"
        label: "דלג לתוכן (לנגישות)"
        component: "bi"
      - name: "hero"
        label: "מסך הפתיחה (Hero)"
        type: "object"
        fields:
          - name: "statement"
            label: "המשפט הראשי"
            component: "bitext"
          - name: "years"
            label: "שורת השנים"
            component: "bi"
          - name: "toWork"
            label: "כפתור לעבודות"
            component: "bi"
          - name: "toContact"
            label: "כפתור ליצירת קשר"
            component: "bi"
          - name: "portrait"
            label: "תיאור הדיוקן (לקוראי מסך)"
            component: "bi"
      - name: "work"
        label: "תווית אזור העבודות"
        component: "bi"
      - name: "workTitle"
        label: "כותרת מעל גלריית הפרויקטים"
        component: "bi"
      - name: "projects"
        label: "המילה פרויקטים"
        component: "bi"
      - name: "viewProject"
        label: "קישור לפרויקט"
        component: "bi"
      - name: "meta"
        label: "תוויות פרטי פרויקט"
        type: "object"
        fields:
          - name: "client"
            label: "לקוח"
            component: "bi"
          - name: "year"
            label: "שנה"
            component: "bi"
          - name: "discipline"
            label: "תחום"
            component: "bi"
          - name: "tools"
            label: "כלים"
            component: "bi"
          - name: "category"
            label: "קטגוריה"
            component: "bi"
      - name: "overview"
        label: "כותרת על הפרויקט"
        component: "bi"
      - name: "gallery"
        label: "כותרת גלריה"
        component: "bi"
      - name: "behance"
        label: "קישור ל-Behance"
        component: "bi"
      - name: "next"
        label: "קישור הפרויקט הבא"
        component: "bi"
      - name: "allProjects"
        label: "שם תיק העבודות (כותרת עמוד /work/)"
        component: "bi"
      - name: "of"
        label: "המילה מתוך"
        component: "bi"
      - name: "breadcrumb"
        label: "תיאור פירורי הלחם (לקוראי מסך)"
        component: "bi"
      - name: "moreProjects"
        label: "כותרת פרויקטים נוספים"
        component: "bi"
      - name: "allWork"
        label: "קישור 'הכול' בשורת הקטגוריות"
        component: "bi"
      - name: "categories"
        label: "שורת הקטגוריות (לקוראי מסך)"
        component: "bi"
      - name: "nextCategory"
        label: "תווית קטגוריה הבאה"
        component: "bi"
      - name: "categoryPage"
        label: "קישור לעמוד הקטגוריה"
        component: "bi"
      - name: "pictured"
        label: "המילה 'בתמונה' (מתחת לגלגלת הקטגוריות)"
        component: "bi"
      - name: "carousel"
        label: "כפתורי הגלילה בדף הבית"
        type: "object"
        fields:
          - name: "prev"
            label: "הקודם"
            component: "bi"
          - name: "next"
            label: "הבא"
            component: "bi"
          - name: "pause"
            label: "עצירה"
            component: "bi"
          - name: "play"
            label: "הפעלה"
            component: "bi"
      - name: "about"
        label: "אודות — התקציר בדף הבית"
        type: "object"
        fields:
          - name: "label"
            label: "כותרת"
            component: "bi"
          - name: "preview"
            label: "טקסט התקציר"
            component: "bitext"
          - name: "more"
            label: "קישור עוד עליי"
            component: "bi"
          - name: "workedWith"
            label: "כותרת עבדתי עם"
            component: "bi"
      - name: "contact"
        label: "צור קשר וטופס"
        type: "object"
        fields:
          - name: "label"
            label: "תווית"
            component: "bi"
          - name: "title"
            label: "כותרת"
            component: "bi"
          - name: "note"
            label: "טקסט הסבר"
            component: "bitext"
          - name: "orEmail"
            label: "או כתבו ישירות"
