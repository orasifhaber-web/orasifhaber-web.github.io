          - name: "body"
            label: "טקסט"
            component: "bi"
          - name: "cta"
            label: "קישור"
            component: "bi"
  - name: "site"
    label: "פרטים אישיים"
    type: "file"
    path: "src/content/site.json"
    format: "json"
    fields:
      - name: "name"
        label: "שם (באנגלית)"
        type: "string"
      - name: "role"
        label: "תפקיד (באנגלית)"
