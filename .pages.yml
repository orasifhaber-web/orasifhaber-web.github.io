          - name: "copy"
            label: "כפתור העתקת מייל"
            component: "bi"
          - name: "copied"
            label: "הודעת הועתק"
            component: "bi"
          - name: "form"
            label: "שדות הטופס והודעות"
            type: "object"
            fields:
              - name: "name"
                label: "שדה שם"
                component: "bi"
              - name: "email"
                label: "שדה אימייל"
                component: "bi"
