              - name: "contactHint"
                label: "הסבר אימייל או טלפון"
                component: "bi"
              - name: "errName"
                label: "שגיאה: שם חסר"
                component: "bi"
              - name: "errEmail"
                label: "שגיאה: אימייל לא תקין"
                component: "bi"
              - name: "errPhone"
                label: "שגיאה: טלפון לא תקין"
                component: "bi"
              - name: "errContact"
                label: "שגיאה: חסר אימייל או טלפון"
